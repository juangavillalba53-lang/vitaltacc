<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="css/global.css">
</head>

<body>

    <header class="navbar">

        <a href="index.html" class="logo">
            <img src="img/logo.png" alt="VitalTacc">
        </a>

        <nav class="nav-links">

            <a href="index.html">Inicio</a>

            <a href="nosotras.html">Nosotras</a>

            <a href="index.html#productos">Productos</a>

        </nav>

        <div class="nav-user" id="nav-user"></div>

    </header>

    <section class="checkout-hero">

        <h1>Finalizar compra</h1>

        <p>
            Revisá tu pedido y completá la compra.
        </p>

    </section>

    <div class="checkout-container">

        <!-- LISTA -->
        <div id="resumen" class="checkout-lista"></div>

        <!-- RESUMEN -->
        <div class="checkout-resumen">
            <h2>Total</h2>
            <p class="precio">$<span id="total"></span></p>

            <div id="seccion-cliente">

                <h3>Cliente</h3>

                <input type="text" id="dniCliente" placeholder="DNI del cliente">

                <button onclick="buscarCliente()">
                    Buscar cliente
                </button>

                <p id="clienteEncontrado"></p>

                <div id="crearClienteBox" style="display:none; margin-top:10px;">

                    <h4>Crear cliente</h4>

                    <input type="text" id="nuevoNombre" placeholder="Nombre">

                    <input type="text" id="nuevoTelefono" placeholder="Teléfono">

                    <button onclick="crearClienteRapido()">
                        Crear cliente
                    </button>

                </div>

            </div>

            <h3>Método de pago</h3>

            <select id="metodoPago">
                <option value="">Seleccionar método</option>
                <option value="EFECTIVO">Efectivo</option>
                <option value="TRANSFERENCIA">Transferencia</option>
                <option value="TARJETA">Tarjeta</option>
            </select>

            <button class="btn-finalizar" onclick="confirmarCompra()">
                Confirmar compra
            </button>
        </div>

    </div>

    <script src="js/global.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/checkout.js"></script>

</body>

</html>
