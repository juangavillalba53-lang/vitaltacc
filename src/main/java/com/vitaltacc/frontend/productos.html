<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos · VitalTacc</title>
    <meta name="description" content="Catálogo de productos sin TACC de VitalTacc: buscá por nombre o filtrá por categoría.">
    <link rel="icon" type="image/png" href="img/logo-vitaltacc.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/tienda.css">
</head>

<body data-pagina="productos">

    <header id="encabezado"></header>

    <main id="contenido" tabindex="-1">

        <section class="contenedor cabecera-pagina">
            <h1>Productos</h1>
            <p>Todo lo que ves acá es libre de gluten y está disponible ahora.</p>
        </section>

        <section class="contenedor" aria-label="Catálogo">
            <div class="filtros">
                <div class="buscador">
                    <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <label for="buscador" class="solo-lectores">Buscar productos</label>
                    <input class="entrada" type="search" id="buscador" placeholder="Buscar por nombre" autocomplete="off">
                </div>
                <div class="chips" id="categorias" role="group" aria-label="Filtrar por categoría"></div>
                <p class="resultado-busqueda" id="resultado" aria-live="polite"></p>
            </div>

            <div class="grilla-productos grilla-catalogo" id="catalogo"></div>

            <div class="ver-mas" id="verMas" hidden>
                <p id="verMasTexto" aria-live="polite"></p>
                <button type="button" class="boton boton-secundario" id="botonVerMas">Ver más productos</button>
            </div>
        </section>

    </main>

    <footer id="pie"></footer>

    <script src="js/tienda/tienda.js"></script>
    <script src="js/tienda/catalogo.js"></script>
</body>

</html>
