<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar · VitalTacc</title>
    <meta name="description" content="Ingresá o creá tu cuenta en VitalTacc.">
    <link rel="icon" type="image/png" href="img/logo-vitaltacc.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/tienda.css">
</head>

<body data-pagina="cuenta">

    <header id="encabezado"></header>

    <main id="contenido" tabindex="-1">

        <div class="pagina-cuenta">
            <div class="cuenta-lado">
                <img src="img/local-interior.webp" alt="" width="1800" height="1199">
                <span class="cinta">Alimentos libres de gluten</span>
                <h2>Tu cuenta en VitalTacc</h2>
            </div>

            <div class="cuenta-formularios">
                <div class="pestanas" role="tablist" aria-label="Ingresar o crear cuenta">
                    <button type="button" role="tab" id="tabIngresar" aria-controls="formIngresar" aria-selected="true">Ingresar</button>
                    <button type="button" role="tab" id="tabRegistro" aria-controls="formRegistro" aria-selected="false">Crear cuenta</button>
                </div>

                <form class="formulario" id="formIngresar" role="tabpanel" aria-labelledby="tabIngresar" novalidate>
                    <h1>Hola de nuevo</h1>

                    <div class="campo">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" autocomplete="email" required>
                    </div>

                    <div class="campo">
                        <label for="loginContrasena">Contraseña</label>
                        <input type="password" id="loginContrasena" autocomplete="current-password" required>
                    </div>

                    <p class="mensaje-formulario" id="mensajeIngresar" role="alert"></p>

                    <button type="submit" class="boton boton-primario boton-ancho">Ingresar</button>
                </form>

                <form class="formulario" id="formRegistro" role="tabpanel" aria-labelledby="tabRegistro" hidden novalidate>
                    <h1>Creá tu cuenta</h1>

                    <div class="aviso-dni">
                        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16a3.4 3.4 0 0 1 6.4 0M14 10h4M14 13h3"/></svg>
                        <span>¿Ya compraste en el local? Usá el mismo DNI que diste en la caja y vas a ver esas compras en tu cuenta.</span>
                    </div>

                    <div class="fila-campos">
                        <div class="campo">
                            <label for="regNombre">Nombre</label>
                            <input type="text" id="regNombre" autocomplete="given-name" required>
                        </div>
                        <div class="campo">
                            <label for="regApellido">Apellido</label>
                            <input type="text" id="regApellido" autocomplete="family-name" required>
                        </div>
                    </div>

                    <div class="fila-campos">
                        <div class="campo">
                            <label for="regDni">DNI</label>
                            <input type="text" id="regDni" inputmode="numeric" autocomplete="off" required>
                            <small>Solo números, sin puntos.</small>
                        </div>
                        <div class="campo">
                            <label for="regTelefono">Teléfono</label>
                            <input type="tel" id="regTelefono" autocomplete="tel">
                            <small>Opcional.</small>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" autocomplete="email" required>
                    </div>

                    <div class="fila-campos">
                        <div class="campo">
                            <label for="regContrasena">Contraseña</label>
                            <input type="password" id="regContrasena" autocomplete="new-password" minlength="8" required>
                            <small>Mínimo 8 caracteres.</small>
                        </div>
                        <div class="campo">
                            <label for="regContrasena2">Repetir contraseña</label>
                            <input type="password" id="regContrasena2" autocomplete="new-password" required>
                        </div>
                    </div>

                    <p class="mensaje-formulario" id="mensajeRegistro" role="alert"></p>

                    <button type="submit" class="boton boton-primario boton-ancho">Crear cuenta</button>
                </form>
            </div>
        </div>

    </main>

    <footer id="pie"></footer>

    <script src="js/comun.js"></script>
    <script src="js/tienda/tienda.js"></script>
    <script src="js/tienda/cuenta.js"></script>
</body>

</html>
